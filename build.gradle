plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

dependencies {
    include implementation("org.jetbrains.kotlin:kotlin-stdlib:2.4.21")
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
}

tasks.named('runServer') {
    standardInput = System.in
}

if (providers.gradleProperty('regenIntegrationTest').isPresent()) {
    sourceSets {
        integrationTest {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + compileClasspath
        }
    }
    loom {
        runs {
            server { runDir 'build/integration-server' }
            client {
                runDir 'build/integration-client'
                programArg '--quickPlaySingleplayer'
                programArg 'regen-client-test'
            }
        }
        mods {
            regen { sourceSet sourceSets.main }
            regen_integration_test { sourceSet sourceSets.integrationTest }
        }
    }
    tasks.named('runServer') {
        dependsOn tasks.named('integrationTestClasses')
        classpath += sourceSets.integrationTest.runtimeClasspath
        doFirst {
            def testDirectory = file('build/integration-server')
            delete testDirectory
            testDirectory.mkdirs()
            new File(testDirectory, 'eula.txt').text = 'eula=true\n'
            new File(testDirectory, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-name=regen-integration-world\nlevel-seed=77\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\n'
        }
    }
    tasks.named('runClient') {
        dependsOn tasks.named('integrationTestClasses')
        classpath += sourceSets.integrationTest.runtimeClasspath
        doFirst {
            def savedWorld = file('build/integration-server/regen-integration-world')
            if (!savedWorld.isDirectory()) {
                throw new GradleException('Run the server integration test before the client integration test')
            }
            def testDirectory = file('build/integration-client')
            delete testDirectory
            copy {
                from savedWorld
                exclude 'session.lock'
                into new File(testDirectory, 'saves/regen-client-test')
            }
            new File(testDirectory, 'options.txt').text = 'pauseOnLostFocus:false\nrenderDistance:2\nsimulationDistance:2\nmaxFps:30\ntutorialStep:none\n'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget("25")
    }
}
